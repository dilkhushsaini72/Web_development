<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table in html</title>
  </head>
  <body>
    <table border="1">
      <caption>
        Food Menu
      </caption>
      <thead>
        <tr>
          <th rowspan="2">Price</th>
          <th colspan="2">Item</th>
        </tr>
        <tr>
          <th>INR</th>
          <th>USD</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>fruity</td>
          <td>10</td>
          <td>0.3</td>
        </tr>
        <tr>
          <td>samosa</td>
          <td>12</td>
          <td>0.30</td>
        </tr>
        <tr>
          <td>chips</td>
          <td>20</td>
          <td>0.10</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
