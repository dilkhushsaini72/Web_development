<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML level 3</title>
  </head>
  <body>
    <h2>table in HTML</h2>
    <table border="1">
      <caption>
        Food menu
      </caption>
      <thead>
        <tr>
          <th rowspan="2">Item</th>
          <th colspan="2">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>fruity</td>
          <td>10</td>
        </tr>
        <tr>
          <td>mango</td>
          <td>20</td>
        </tr>
        <tr>
          <td>orange</td>
          <td>26</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
